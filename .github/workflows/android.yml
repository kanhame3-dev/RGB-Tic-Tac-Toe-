name: Build RGB Tic Tac Toe

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract game project
        run: |
          ZIP=$(find . -maxdepth 1 -iname '*.zip' | head -n 1)
          unzip -q "$ZIP" -d extracted
          PROJECT=$(find extracted -name settings.gradle | head -n 1 | xargs dirname)
          echo "PROJECT=$PROJECT" >> $GITHUB_ENV

      - name: Build APK
        run: gradle -p "$PROJECT" assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: RGB-Tic-Tac-Toe-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
